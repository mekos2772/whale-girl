[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimi-desktop-pet"
version = "0.1.0"
description = "Mimi desktop pet runtime framework"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qt = ["PySide6>=6.7,<7"]

[project.scripts]
mimi-pet = "mimi_pet.main:main"

[tool.setuptools.packages.find]
where = ["src"]
